        window.addEventListener('keydown', function (e) {
            e = e || window.event;

                e.preventDefault();

                var sitio = (window.location.host + '_' + window.location.pathname.split('/')[1]).toLowerCase();

                    localStorage.removeItem(sitio + '_css_theme');
                    window.location.reload();
                } else {

                    window.location.reload()

                }
            }
        });
